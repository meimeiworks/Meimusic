name: Build Meimusic (Android 6-9)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Clean Manifest
        run: |
          P="and""roid:"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://android.com">\n<application %slabel="Meimusic Alpha" %stheme="@style/Theme.AppCompat.NoActionBar">\n<activity %sname=".MainActivity" %sexported="true">\n<intent-filter>\n<action %sname="android.intent.action.MAIN" />\n<category %sname="android.intent.category.LAUNCHER" />\n</intent-filter>\n</activity>\n</application>\n</manifest>\n' "$P" "$P" "$P" "$P" "$P" "$P" > app/src/main/AndroidManifest.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Android 6-9 APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meimusic-Android-6-9
          path: app/build/outputs/apk/debug/app-debug.apk
